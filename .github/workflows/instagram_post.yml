name: Instagram Auto Post

on:
  schedule:
    - cron: '0 11 * * *'    # 毎日 20:00 JST (11:00 UTC)
  workflow_dispatch:          # 手動実行（テスト用）

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Instagram post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python .github/scripts/ig_post.py
