name: Weekly Instagram Content Setup

on:
  schedule:
    - cron: '0 9 * * 0'   # 毎週日曜 18:00 JST (09:00 UTC) に実行
  workflow_dispatch:        # 手動実行（テスト用）

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Install Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate next week's content
        run: python .github/scripts/weekly_generator.py

      - name: Commit and push generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add carousel/ schedule.json used_questions.json
          git diff --cached --quiet && echo "変更なし" || \
            git commit -m "Auto: generate weekly Instagram content $(date +%Y-%m-%d)" && \
            git push
